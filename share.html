<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>廣利成 kLC ｜ 掃描看公司</title>
<meta name="description" content="廣利成股份有限公司 kLC — 掃描 QR 看公司介紹 / 加入聯絡人。半導體設備機殼・散熱機櫃・精密鈑金一條龍。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="廣利成 kLC">
<link rel="apple-touch-icon" href="img/qr_company_profile.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#12203A;
    --navy-2:#1c3157;
    --cream:#F1EEE4;
    --steel:#8a94a6;
    --accent:#b9541b;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --disp:"Barlow Semi Condensed","Noto Sans TC",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans);color:var(--cream);
    background:var(--navy);
    background-image:
      linear-gradient(115deg,transparent 58%,rgba(255,255,255,.045) 58%,rgba(255,255,255,.045) 61%,transparent 61%),
      linear-gradient(115deg,transparent 74%,rgba(255,255,255,.04) 74%,rgba(255,255,255,.04) 76%,transparent 76%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(10px,2.2vh,24px);
    padding:max(16px,env(safe-area-inset-top)) 18px max(16px,env(safe-area-inset-bottom));
    text-align:center;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  .brand .k{font-family:var(--disp);font-size:clamp(30px,7vmin,52px);font-weight:700;letter-spacing:.02em;line-height:1}
  .brand .cn{font-size:clamp(13px,2.4vmin,17px);letter-spacing:.14em;font-weight:500;color:#d7dbe4;margin-top:8px}
  .brand .en{font-family:var(--disp);letter-spacing:.2em;text-transform:uppercase;font-size:clamp(10px,1.8vmin,12.5px);color:var(--steel);margin-top:6px}

  .tabs{display:flex;gap:10px}
  .tab{
    font-size:clamp(12px,2vmin,14px);font-weight:700;letter-spacing:.05em;
    color:var(--cream);background:transparent;
    border:1.5px solid rgba(255,255,255,.35);border-radius:999px;
    padding:9px 18px;cursor:pointer;transition:.15s;font-family:var(--sans);
  }
  .tab[aria-selected="true"]{background:var(--cream);color:var(--navy);border-color:var(--cream)}

  .qrcard{
    background:#fff;border-radius:18px;
    padding:clamp(12px,2.6vmin,24px);
    box-shadow:0 24px 60px rgba(0,0,0,.4);
    line-height:0;
  }
  .qrcard img{
    width:min(56vmin,60vh,460px);height:auto;display:block;border-radius:6px;
  }

  .cap{line-height:1.5}
  .cap .cn{font-size:clamp(16px,3vmin,22px);font-weight:900;letter-spacing:.04em}
  .cap .en{font-size:clamp(11px,1.9vmin,13.5px);color:#c9cfdb;margin-top:4px;letter-spacing:.05em}

  .foot{
    font-family:var(--disp);letter-spacing:.18em;text-transform:uppercase;
    font-size:clamp(9px,1.6vmin,11px);color:#7a8496;
  }
</style>
</head>
<body>

  <div class="brand">
    <div class="k">kLC</div>
    <div class="cn">廣利成股份有限公司</div>
    <div class="en">Kwan Li Cheng Co., Ltd. · Precision Sheet Metal</div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" id="tab-co" role="tab" aria-selected="true" data-img="img/qr_company_profile.png"
      data-cn="掃描看公司・作品" data-en="Scan for company &amp; work page">公司・作品</button>
    <button class="tab" id="tab-vc" role="tab" aria-selected="false" data-img="img/qr_vcard.png"
      data-cn="掃描加入聯絡人" data-en="Scan to save contact">加入聯絡人</button>
  </div>

  <div class="qrcard">
    <img id="qrimg" src="img/qr_company_profile.png" alt="QR code">
  </div>

  <div class="cap">
    <div class="cn" id="capcn">掃描看公司・作品</div>
    <div class="en" id="capen">Scan for company &amp; work page</div>
  </div>

  <div class="foot">SEMICON Taiwan 2026 · 半導體設備機殼・散熱機櫃・鈑金一條龍</div>

<script>
  var tabs=document.querySelectorAll('.tab'),
      img=document.getElementById('qrimg'),
      capcn=document.getElementById('capcn'),
      capen=document.getElementById('capen');
  tabs.forEach(function(t){
    t.addEventListener('click',function(){
      tabs.forEach(function(x){x.setAttribute('aria-selected', x===t ? 'true':'false')});
      img.src=t.dataset.img;
      capcn.textContent=t.dataset.cn;
      capen.innerHTML=t.dataset.en;
    });
  });
</script>

</body>
</html>
